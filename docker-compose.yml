services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: travelwise-api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    environment:
      # Ghi đè localhost thành host.docker.internal để container gọi được SQL Server trên máy host
      - SQLSERVER_SERVER=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount thư mục dữ liệu Chroma vector store
      - ./apps/api/data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: travelwise-web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmaps-crawler"
version = "0.1.0"
description = "Standalone asynchronous Google Maps crawler using Playwright, designed for AI RAG vector databases and relational databases (PostgreSQL/SQL Server)."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TravelWise Engineering", email = "dev@travelwise.local" },
]
dependencies = [
    "playwright>=1.40.0",
    "pyodbc>=5.3.0",
    "tqdm>=4.66.0",
]

[project.scripts]
gmaps-crawler = "main:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
